# Mounted by docker-compose.yml only; cPanel does not load this Apache config.
# Keep previews limited to the site itself and VS Code's webview/app origins.
<Location "/">
    Header always unset X-Frame-Options
    Header onsuccess unset X-Frame-Options
    Header onsuccess unset Content-Security-Policy
    Header always set Content-Security-Policy "frame-ancestors 'self' vscode-webview: vscode-file: https://*.vscode-cdn.net https://*.vscode-webview.net; object-src 'none'; base-uri 'self'"
</Location>

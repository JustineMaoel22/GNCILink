; Raises PHP's upload ceiling to match the app's 10MB image / 50MB video
; limits (see uploadHeroMedia() in admin-functions.php).
;
; For the official php:*-apache or php:*-fpm Docker images, any .ini file
; dropped into /usr/local/etc/php/conf.d/ is automatically loaded.

upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
max_input_time = 120
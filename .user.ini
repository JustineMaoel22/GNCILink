; PHP-FPM/shared hosting: match the existing Docker upload limits.
; Application validation still rejects images over 5 MB.
; Larger PHP limits preserve the separate 50 MB video upload feature.
upload_max_filesize = 64M
post_max_size = 256M
max_file_uploads = 50
max_input_time = 120
max_execution_time = 120
; Keep shared-host session cleanup aligned with the default admin idle window.
; initSession() also respects a longer configured SESSION_TIMEOUT.
session.gc_maxlifetime = 1800
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.use_only_cookies = 1

services:
  # The Web Server (Apache + PHP)
  web:
      build: .
      command: ["/bin/sh", "-c", "a2enmod rewrite headers && exec apache2-foreground"]
      ports:
        - "8080:80"
      volumes:
        - .:/var/www/html
        - ./config/apache-local-preview.conf:/etc/apache2/conf-enabled/zz-local-preview.conf:ro

  # The Database
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gnc_admin
    ports:
      - "3306:3306"

  phpmyadmin:
      image: phpmyadmin/phpmyadmin
      restart: always
      ports:
        - "8081:80"
      environment:
        PMA_HOST: db
      depends_on:
        - db

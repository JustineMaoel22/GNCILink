    <style>
*{box-sizing:border-box}
:root{color-scheme:light;font-family:Inter,sans-serif;color:#153e2c;background:#fcfbf7}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:56px 24px;border-top:3px solid #094024;position:relative;isolation:isolate}
.watermark{position:fixed;z-index:-1;pointer-events:none;width:min(760px,90vh);height:auto;right:-190px;top:50%;transform:translateY(-50%);filter:grayscale(1);opacity:.035}
main{width:min(800px,100%);text-align:center}
.eyebrow{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:0 0 24px;padding:7px 15px;border:1px solid #eeeae0;border-radius:999px;background:#fff;color:#244b39;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.eyebrow::before{content:"";width:6px;height:6px;flex-shrink:0;background:#ca920e;border-radius:50%}
.error-number{margin:0;color:#e9eefb;font-size:clamp(112px,21vw,176px);font-weight:800;line-height:.85;letter-spacing:-.06em;user-select:none}
.pathway{position:relative;display:table;max-width:100%;margin:-8px auto 0;padding:4px 9px;background:#ffe1a0;color:#614100;font-size:9px;font-weight:700;letter-spacing:.15em;line-height:1.6}
h1{margin:9px 0 14px;font:700 clamp(27px,4.3vw,38px)/1.2 "Noto Serif",serif;color:#094024;letter-spacing:-.025em}
.description{max-width:590px;margin:0 auto;color:#42564a;font-size:15px;line-height:1.8;text-wrap:pretty}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:34px}
.actions a{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:12px 20px;border:1px solid #094024;border-radius:4px;background:#094024;color:#fff;text-decoration:none;font-size:12px;font-weight:650;line-height:1.5;box-shadow:0 2px 4px #09402412}
.actions .secondary{border-color:#eeeae0;background:#fff;color:#805900;box-shadow:none}
.actions a:hover{background:#165c3d;color:#fff}.actions .secondary:hover{background:#fff5df;color:#614100;border-color:#dfc78e}
.actions a:focus-visible{outline:3px solid #dba928;outline-offset:4px}.actions svg{width:17px;height:17px;flex-shrink:0}
@media(max-width:480px){body{padding:40px 20px}.eyebrow{font-size:8px;letter-spacing:.09em;padding:7px 10px}.description{font-size:14px}.actions{display:grid;gap:12px;margin:28px auto 0;max-width:290px}.watermark{right:-220px;width:600px}.pathway{font-size:8px}}
    </style>
</head>

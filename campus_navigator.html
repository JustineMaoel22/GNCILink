<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
<title>Campus Navigator</title>
<style>
:root{--cream:#F9F6F1;--green:#094024;--gold:#eaba3b;--hi:#1f6fb5;--ink:#16221a;--muted:#5d6b62;--card:#fff;--line:rgba(9,64,36,.14);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px}
/* building chips */
#chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;justify-content:center;flex-wrap:wrap}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 10px;background:var(--card);border:1px solid var(--line);border-radius:999px;font:600 13px/1 Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(9,64,36,.06);transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.chip b{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.04em}
@media (hover:hover){.chip:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(9,64,36,.12)}}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.on b{color:rgba(255,255,255,.7)}
button:focus-visible,.bld:focus-visible .main{outline:2px solid var(--hi);outline-offset:2px}
/* map */
#mapwrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;border-radius:18px;background:#f8f5f0;border:1px solid var(--line);box-shadow:0 8px 28px rgba(9,64,36,.10);overflow:hidden}
svg{height:100%;max-width:100%;width:auto;display:block}
/* legend card (top-left of the map) */
#legend{position:absolute;bottom:10px;left:10px;z-index:2;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:11px;line-height:1.55;color:var(--ink);box-shadow:0 2px 10px rgba(9,64,36,.08);pointer-events:none;max-width:46%}
#legend h4{margin:0 0 3px;font:700 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#legend h4:not(:first-child){margin-top:8px}
#legend span{display:block;white-space:nowrap}
#legend b{display:inline-block;min-width:34px;font-weight:700;color:var(--green)}
@media (max-width:560px){
  #legend{max-width:none;padding:7px 9px;font-size:10px;line-height:1.4;bottom:8px;left:8px}
  #legend>div:first-child{display:none}
  #mapwrap:has(#hud.on) #legend{opacity:0}
  #mapwrap{border-radius:14px}
  #stage{padding:8px}
  #chips{flex-wrap:nowrap;justify-content:flex-start}
  #hud{top:auto!important;bottom:10px!important;transform:translate(-50%,12px)!important}
  #hud.on{transform:translate(-50%,0)!important}
}
/* status card */
#hud{position:absolute;left:50%;top:12px;transform:translate(-50%,-12px);z-index:3;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;background:var(--green);color:#fff;border-radius:999px;font-size:13px;box-shadow:0 10px 24px rgba(9,64,36,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#hud.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#hud small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
#hud strong{font-weight:700;font-size:14px}
#clr{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font:600 12px Inter,sans-serif;padding:8px 13px;cursor:pointer}
#clr:hover{background:rgba(255,255,255,.28)}
/* buildings */
.bld{cursor:pointer;outline:none}
.bld .glow{opacity:0}
.bld .main{fill-opacity:.42;stroke-opacity:.9;stroke-linejoin:round;transition:fill-opacity .25s,stroke-opacity .25s}
.bld .lbl{opacity:1;paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:4;stroke-linejoin:round;letter-spacing:.04em;pointer-events:none;transition:opacity .25s}
.bld:focus-visible .main{fill-opacity:.6}
@media (hover:hover){.bld:hover .main{fill-opacity:.62;stroke-opacity:1}}
svg.active .bld:not(.sel) .main{fill-opacity:.2;stroke-opacity:.5}
svg.active .bld:not(.sel) .lbl{opacity:.55}
.bld.sel .main{fill-opacity:.72;stroke-opacity:1;stroke-width:5}
.bld.sel .glow{animation:glow 2s 3.2s ease-out forwards}
@keyframes glow{0%{opacity:0}30%{opacity:1}100%{opacity:.6}}
/* route: white casing + gold line with flowing highlight */
#casing,#path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;visibility:hidden;pointer-events:none}
#casing{stroke:#fff;stroke-width:31;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
#path{filter:drop-shadow(0 0 8px rgba(255,205,50,.9))}
#casing.go,#path.go{visibility:visible;animation:draw 2.8s .4s ease-in-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#flow{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:5;stroke-linecap:round;stroke-dasharray:2 34;pointer-events:none;visibility:hidden}
#flow.go{visibility:visible;animation:flow 1.2s 3.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
/* destination marker */
#dest{opacity:0;pointer-events:none}
#dest.go{animation:fadein .4s 3.1s forwards}
@keyframes fadein{to{opacity:1}}
#dest .ring{transform-box:fill-box;transform-origin:center;animation:ping 1.8s 3.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
/* start tag */
#gate rect{fill:var(--green)}
#gate text{fill:#fff;font:700 34px Inter,sans-serif;letter-spacing:.08em}
/* pin */
#pinwrap{opacity:0;transition:opacity .3s;pointer-events:none}
svg.active #pinwrap{opacity:1}
#pin{animation:bounce .9s cubic-bezier(.3,0,.4,1) infinite;transform-box:fill-box}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
#shadow{transform-box:fill-box;transform-origin:center;animation:shadow .9s cubic-bezier(.3,0,.4,1) infinite}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.6);opacity:.15}}
@media (prefers-reduced-motion:reduce){
  #pin,#shadow,#flow.go,#dest .ring{animation:none}
  #casing.go,#path.go{animation:none;stroke-dashoffset:0}
  #dest.go{animation:none;opacity:1}
  .bld.sel .glow{animation:none;opacity:.6}
}

/* ===== responsive layer ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow:hidden;overscroll-behavior:none;height:100vh;height:100dvh}
#stage{height:100vh;height:100dvh;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#chips{overscroll-behavior:contain}
.chip{scroll-snap-align:center}
@media (pointer:coarse){.chip{min-height:40px;padding:8px 14px 8px 11px}#clr{min-height:36px}}
/* map fills its frame; the viewBox is driven by JS (fit / pan) */
#mapwrap{touch-action:pan-y}
#map{width:100%;height:100%;max-width:none;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
#map.dragging{cursor:grabbing}
/* phones & small tablets in portrait: chips scroll sideways */
@media (max-width:899px){
  #chips{flex-wrap:nowrap;justify-content:flex-start;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
}
/* anything landscape (phones, tablets, laptops, desktops): chips become a side list */
@media (min-width:600px) and (min-aspect-ratio:1/1){
  #stage{flex-direction:row;align-items:stretch;gap:14px}
  #chips{flex:0 0 clamp(190px,24%,260px);flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;align-content:flex-start;overflow-x:hidden;overflow-y:auto;scroll-snap-type:none;padding:2px 4px 2px 2px}
  .chip{width:100%;justify-content:flex-start}
  .chip b{margin-left:auto}
  #mapwrap{flex:1 1 auto;min-width:0}
}
/* tablets: slightly smaller legend so it covers less of the map */
@media (min-width:561px) and (max-width:899px){#legend{font-size:10.5px;line-height:1.45;padding:7px 10px}}
/* big screens */
@media (min-width:1400px){#legend{font-size:12px}.chip{font-size:14px}}
/* small phones */
@media (max-width:560px){
  #stage{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .chip{font-size:12.5px}
  #hud{max-width:calc(100% - 20px);gap:8px;padding:6px 6px 6px 12px}
  #hud strong{font-size:13px;overflow:hidden;text-overflow:ellipsis}
  #hud>div{min-width:0}
  #legend{display:none}
}
@media (max-width:360px){#hud small{display:none}}
/* short screens (landscape phones) */
@media (max-height:480px){
  #legend{display:none}
  #stage{padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  .chip{padding:6px 11px 6px 9px;font-size:12px}
}
</style></head>

<script>
var B={"beta": {"name": "Beta Building", "d": "M1036 1989.5 H814.5 V1283.5 H895"}, "banzali": {"name": "Banzali Hall", "d": "M1036 1989.5 H1261.5 V1392 H1332"}, "tanjangco": {"name": "Tanjangco Hall", "d": "M1036 1989.5 H814.5 V530 H688"}, "goseco": {"name": "Goseco Hall", "d": "M1036 1989.5 H814.5 V873 H847"}, "puno": {"name": "Puno Hall", "d": "M1036 1989.5 H807.5 V1685 H755"}, "limlingan": {"name": "Limlingan Hall", "d": "M1036 1989.5 H814.5 V1289.5 H755"}};
var svg=document.getElementById('map'),path=document.getElementById('path'),casing=document.getElementById('casing'),flow=document.getElementById('flow'),dest=document.getElementById('dest'),hud=document.getElementById('hud'),statusEl=document.getElementById('status'),chips=document.getElementById('chips');
var META={beta:['BETA','#147a2d'],banzali:['BH','#c0272d'],tanjangco:['TH','#147a2d'],goseco:['GH','#eebf4a'],puno:['PH','#3a77a1'],limlingan:['LH','#3f7d4b']};
var current=null;
Object.keys(B).forEach(function(id){
  var c=document.createElement('button');c.type='button';c.className='chip';c.id='c-'+id;c.style.setProperty('--c',META[id][1]);
  c.innerHTML='<i></i>'+B[id].name+' <b>'+META[id][0]+'</b>';
  c.addEventListener('click',function(){current===id?clear():go(id)});
  chips.appendChild(c);
});
function clear(keepView){
  current=null;
  [path,casing,flow,dest].forEach(function(e){e.classList.remove('go')});
  svg.classList.remove('active');
  document.querySelectorAll('.bld').forEach(function(e){e.classList.remove('sel')});
  document.querySelectorAll('.chip').forEach(function(e){e.classList.remove('on')});
  hud.classList.remove('on');
  if(!keepView&&window.fitView)fitView(true);
}
function go(id){
  clear(true);current=id;
  void svg.getBoundingClientRect(); // restart animations
  var d=B[id].d;
  [path,casing,flow].forEach(function(e){e.setAttribute('d',d)});
  var x,y;
  // destination = final point of the route (path is H/V segments)
  var len=path.getTotalLength(),pt=path.getPointAtLength(len);x=pt.x;y=pt.y;
  dest.setAttribute('transform','translate('+x+' '+y+')');
  [path,casing,flow,dest].forEach(function(e){e.classList.add('go')});
  svg.classList.add('active');
  document.getElementById('b-'+id).classList.add('sel');
  var _c=document.getElementById('c-'+id);_c.classList.add('on');if(_c.scrollIntoView)try{_c.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}catch(e){}
  statusEl.textContent=B[id].name;
  hud.classList.add('on');
  // Auto-focus/zoom disabled: selecting a building no longer changes the map view.
}
document.getElementById('clr').addEventListener('click',function(){clear()});
document.querySelectorAll('.bld').forEach(function(e){
  e.addEventListener('click',function(){go(e.dataset.id)});
  e.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go(e.dataset.id)}});
});

/* ===== viewport: fit / pan, and auto-focus on the route ===== */
(function(){
  var MW=1536,MH=2304,MAXZ=5,wrap=document.getElementById('mapwrap');
  var view={z:1,cx:MW/2,cy:MH/2},raf=0,moved=false,drag=null,ptrs=new Map();
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function cz(z){return Math.min(MAXZ,Math.max(1,z))}
  function box(){var r=svg.getBoundingClientRect();return{l:r.left,t:r.top,w:r.width||1,h:r.height||1}}
  // visible map area at zoom z; always matches the frame's aspect ratio so nothing is letterboxed
  function dims(z){var b=box(),A=b.w/b.h,M=MW/MH,w,h;if(A>M){h=MH;w=h*A}else{w=MW;h=w/A}return{w:w/z,h:h/z}}
  function apply(v){
    var d=dims(v.z);
    v.cx=d.w>=MW?MW/2:Math.min(Math.max(v.cx,d.w/2),MW-d.w/2);
    v.cy=d.h>=MH?MH/2:Math.min(Math.max(v.cy,d.h/2),MH-d.h/2);
    svg.setAttribute('viewBox',(v.cx-d.w/2).toFixed(2)+' '+(v.cy-d.h/2).toFixed(2)+' '+d.w.toFixed(2)+' '+d.h.toFixed(2));
    // zoomed out: let the parent page scroll through the map (iframe); zoomed in: map takes the drag
    var ta=v.z>1.02?'none':'pan-y';svg.style.touchAction=ta;wrap.style.touchAction=ta;
  }
  function setView(cx,cy,z,anim){
    z=cz(z);cancelAnimationFrame(raf);
    if(!anim||reduce){view={z:z,cx:cx,cy:cy};apply(view);return}
    var s={z:view.z,cx:view.cx,cy:view.cy},t0=performance.now(),D=550;
    (function step(t){
      var k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);
      view={z:Math.exp(Math.log(s.z)+(Math.log(z)-Math.log(s.z))*e),cx:s.cx+(cx-s.cx)*e,cy:s.cy+(cy-s.cy)*e};
      apply(view);
      if(k<1)raf=requestAnimationFrame(step);
    })(t0);
  }
  function toMap(px,py){var b=box(),d=dims(view.z);return[view.cx-d.w/2+(px-b.l)/b.w*d.w,view.cy-d.h/2+(py-b.t)/b.h*d.h]}
  function zoomAt(px,py,nz,anim){
    nz=cz(nz);var m=toMap(px,py),b=box(),d=dims(nz),fx=(px-b.l)/b.w,fy=(py-b.t)/b.h;
    setView(m[0]-(fx-.5)*d.w,m[1]-(fy-.5)*d.h,nz,anim);
  }

  window.fitView=function(anim){setView(MW/2,MH/2,1,anim)};
  window.focusRoute=function(id){
    try{
      var p=path.getBBox(),bl=document.getElementById('b-'+id).getBBox();
      var x0=Math.min(p.x,bl.x,920),y0=Math.min(p.y,bl.y),x1=Math.max(p.x+p.width,bl.x+bl.width,1150),y1=Math.max(p.y+p.height,bl.y+bl.height,2095);
      var pad=130;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
      if(window.innerWidth<=560)y1+=120; // leave room for the status card on phones
      var d1=dims(1);
      setView((x0+x1)/2,(y0+y1)/2,Math.min(d1.w/(x1-x0),d1.h/(y1-y0)),true);
    }catch(e){}
  };

  // drag to pan
  function pts(){return Array.from(ptrs.values())}

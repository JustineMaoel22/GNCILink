<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- The optional font must not block map parsing, rendering or controls. -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" />
    </noscript>
    <title>Campus Navigator</title>
    <script>
      if (new URLSearchParams(window.location.search).get("view") === "office")
        document.documentElement.classList.add("office-location-map");
    </script>
    <style>
      :root {
        --cream: #f9f6f1;
        --green: #094024;
        --gold: #eaba3b;
        --hi: #1f6fb5;
        --ink: #16221a;
        --muted: #5d6b62;
        --card: #fff;
        --line: rgba(9, 64, 36, 0.14);
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px 12px 12px;
      }
      /* building chips */
      #chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 2px 2px 4px;
        justify-content: center;
        flex-wrap: wrap;
      }
      #chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 13px 7px 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        font:
          600 13px/1 Inter,
          system-ui,
          sans-serif;
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(9, 64, 36, 0.06);
        transition:
          transform 0.15s,
          box-shadow 0.15s,
          background 0.15s,
          border-color 0.15s;
      }
      .chip i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--c);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent);
      }
      .chip b {
        font-weight: 700;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      @media (hover: hover) {
        .chip:hover {
          transform: translateY(-1px);
          box-shadow: 0 4px 10px rgba(9, 64, 36, 0.12);
        }
      }
      .chip.on {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }
      .chip.on b {
        color: rgba(255, 255, 255, 0.7);
      }
      button:focus-visible,
      .bld:focus-visible .main {
        outline: 2px solid var(--hi);
        outline-offset: 2px;
      }
      /* map */
      #mapwrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        border-radius: 18px;
        background: #fbfbfb;
        border: 1px solid var(--line);
        box-shadow: 0 8px 28px rgba(9, 64, 36, 0.1);
        overflow: hidden;
      }
      svg {
        height: 100%;
        max-width: 100%;
        width: auto;
        display: block;
      }
      /* legend card (top-left of the map) */
      #legend {
        position: absolute;
        bottom: 10px;
        left: 10px;
        z-index: 2;
        background: rgba(255, 255, 255, 0.92);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 9px 12px;
        font-size: 11px;
        line-height: 1.55;
        color: var(--ink);
        box-shadow: 0 2px 10px rgba(9, 64, 36, 0.08);
        pointer-events: none;
        max-width: 46%;
      }
      #legend h4 {
        margin: 0 0 3px;
        font:
          700 9.5px/1 Inter,
          sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #legend h4:not(:first-child) {
        margin-top: 8px;
      }
      #legend > div + div {
        margin-top: 8px;
      }
      #legend span {
        display: block;
        white-space: nowrap;
      }
      #legend b {
        display: inline-block;
        min-width: 34px;
        font-weight: 700;
        color: var(--green);
      }
      @media (max-width: 560px) {
        #legend {
          max-width: none;
          padding: 7px 9px;
          font-size: 10px;
          line-height: 1.4;
          bottom: 8px;
          left: 8px;
        }
        #legend > div:first-child {
          display: none;
        }
        #mapwrap:has(#hud.on) #legend {
          opacity: 0;
        }
        #mapwrap {
          border-radius: 14px;
        }
        #stage {
          padding: 8px;
        }
        #chips {
          flex-wrap: nowrap;
          justify-content: flex-start;
        }
        #hud {
          top: auto !important;
          bottom: 10px !important;
          transform: translate(-50%, 12px) !important;
        }
        #hud.on {
          transform: translate(-50%, 0) !important;
        }
      }
      /* status card */
      #hud {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translate(-50%, -12px);
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 8px 8px 14px;
        background: var(--green);
        color: #fff;
        border-radius: 999px;
        font-size: 13px;
        box-shadow: 0 10px 24px rgba(9, 64, 36, 0.35);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s,
          transform 0.25s;
        white-space: nowrap;
      }
      #hud.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      #hud small {
        display: block;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 700;
      }
      #hud strong {
        font-weight: 700;
        font-size: 14px;
      }
      #clr {
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        font:
          600 12px Inter,
          sans-serif;
        padding: 8px 13px;
        cursor: pointer;
      }
      #clr:hover {
        background: rgba(255, 255, 255, 0.28);
      }
      /* buildings */
      .bld {
        cursor: pointer;
        outline: none;
      }
      .bld .glow {
        opacity: 0;
      }
      .bld .main {
        fill-opacity: 0.42;
        stroke-opacity: 0.9;
        stroke-linejoin: round;
        transition:
          fill-opacity 0.25s,
          stroke-opacity 0.25s;
      }
      .bld .lbl {
        opacity: 1;
        paint-order: stroke;
        stroke: rgba(0, 0, 0, 0.4);
        stroke-width: 4;
        stroke-linejoin: round;
        letter-spacing: 0.04em;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .bld:focus-visible .main {
        fill-opacity: 0.6;
      }
      @media (hover: hover) {
        .bld:hover .main {
          fill-opacity: 0.62;
          stroke-opacity: 1;
        }
      }
      svg.active .bld:not(.sel) .main {
        fill-opacity: 0.2;
        stroke-opacity: 0.5;
      }
      svg.active .bld:not(.sel) .lbl {
        opacity: 0.55;
      }
      .bld.sel .main {
        fill-opacity: 0.72;
        stroke-opacity: 1;
        stroke-width: 5;
      }
      .bld.sel .glow {
        animation: glow 2s 3.2s ease-out forwards;
      }
      @keyframes glow {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }
      /* route: white casing + gold line with flowing highlight */
      #casing,
      #path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        visibility: hidden;
        pointer-events: none;
      }
      #casing {
        stroke: #fff;
        stroke-width: 26;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35));
      }
      #path {
        filter: drop-shadow(0 0 8px rgba(255, 40, 40, 0.85));
      }
      #casing.go,
      #path.go {
        visibility: visible;
        animation: draw 2.8s 0.4s ease-in-out forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      #flow {
        fill: none;
        stroke: #fff;
        stroke-opacity: 0.85;
        stroke-width: 4.2;
        stroke-linecap: round;
        stroke-dasharray: 1.7 28.4;
        pointer-events: none;
        visibility: hidden;
      }
      #flow.go {
        visibility: visible;
        animation: flow 1.2s 3.2s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -30.1;
        }
      }
      /* destination marker */
      #dest {
        opacity: 0;
        pointer-events: none;
      }
      #dest.go {
        animation: fadein 0.4s 3.1s forwards;
      }
      @keyframes fadein {
        to {
          opacity: 1;
        }
      }
      #dest .ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: ping 1.8s 3.2s ease-out infinite;
      }
      @keyframes ping {
        0% {
          transform: scale(0.6);
          opacity: 0.8;
        }
        100% {
          transform: scale(2.4);
          opacity: 0;
        }
      }
      /* start tag */
      #gate rect {
        fill: var(--green);
      }
      #gate text {
        fill: #fff;
        font:
          700 34px Inter,
          sans-serif;
        letter-spacing: 0.08em;
      }
      /* pin */
      #pinwrap {
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      svg.active #pinwrap {
        opacity: 1;
      }
      #pin {
        animation: bounce 0.9s cubic-bezier(0.3, 0, 0.4, 1) infinite;
        transform-box: fill-box;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-34px);
        }
      }
      #shadow {
        transform-box: fill-box;
        transform-origin: center;
        animation: shadow 0.9s cubic-bezier(0.3, 0, 0.4, 1) infinite;
      }
      @keyframes shadow {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.35;
        }
        50% {
          transform: scale(0.6);
          opacity: 0.15;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pin,
        #shadow,
        #flow.go,
        #dest .ring {
          animation: none;
        }
        #casing.go,
        #path.go {
          animation: none;
          stroke-dashoffset: 0;
        }
        #dest.go {
          animation: none;
          opacity: 1;
        }
        .bld.sel .glow {
          animation: none;
          opacity: 0.6;
        }
      }

      /* ===== responsive layer ===== */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        height: 100vh;
        height: 100dvh;
      }
      #stage {
        height: 100vh;
        height: 100dvh;
        padding: max(10px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }
      #chips {
        overscroll-behavior: contain;
      }
      .chip {
        scroll-snap-align: center;
      }
      @media (pointer: coarse) {
        .chip {
          min-height: 40px;
          padding: 8px 14px 8px 11px;
        }
        #clr {
          min-height: 36px;
        }
      }
      /* map fills its frame; the viewBox is driven by JS (fit / pan) */
      #mapwrap {
        touch-action: pan-y;
      }
      #map {
        width: 100%;
        height: 100%;
        max-width: none;
        touch-action: pan-y;
        -webkit-user-select: none;
        user-select: none;
        cursor: grab;
      }
      #map.dragging {
        cursor: grabbing;
      }
      /* phones & small tablets in portrait: chips scroll sideways */
      @media (max-width: 899px) {
        #chips {
          flex-wrap: nowrap;
          justify-content: flex-start;
          scroll-snap-type: x proximity;
          -webkit-overflow-scrolling: touch;
        }
      }
      /* anything landscape (phones, tablets, laptops, desktops): chips become a side list */
      @media (min-width: 600px) and (min-aspect-ratio: 1/1) {
        #stage {
          flex-direction: row;
          align-items: stretch;
          gap: 14px;
        }
        #chips {
          flex: 0 0 clamp(190px, 24%, 260px);
          flex-direction: column;
          flex-wrap: nowrap;
          justify-content: flex-start;
          align-content: flex-start;
          overflow-x: hidden;
          overflow-y: auto;
          scroll-snap-type: none;
          padding: 2px 4px 2px 2px;
        }
        .chip {
          width: 100%;
          justify-content: flex-start;
        }
        .chip b {
          margin-left: auto;
        }
        #mapwrap {
          flex: 1 1 auto;
          min-width: 0;
        }
      }
      /* tablets: slightly smaller legend so it covers less of the map */
      @media (min-width: 561px) and (max-width: 899px) {
        #legend {
          font-size: 10.5px;
          line-height: 1.45;
          padding: 7px 10px;
        }
      }
      /* big screens */
      @media (min-width: 1400px) {
        #legend {
          font-size: 12px;
        }
        .chip {
          font-size: 14px;
        }
      }
      /* small phones */
      @media (max-width: 560px) {
        #stage {
          padding: max(8px, env(safe-area-inset-top))
            max(8px, env(safe-area-inset-right))
            max(8px, env(safe-area-inset-bottom))
            max(8px, env(safe-area-inset-left));
        }
        .chip {
          font-size: 12.5px;
        }
        #hud {
          max-width: calc(100% - 20px);
          gap: 8px;
          padding: 6px 6px 6px 12px;
        }
        #hud strong {
          font-size: 13px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #hud > div {
          min-width: 0;
        }
        #legend {
          display: none;
        }
      }
      @media (max-width: 360px) {
        #hud small {
          display: none;
        }
      }
      /* short screens (landscape phones) */
      @media (max-height: 480px) {
        #legend {
          display: none;
        }
        #stage {
          padding: max(6px, env(safe-area-inset-top))
            max(10px, env(safe-area-inset-right))
            max(6px, env(safe-area-inset-bottom))
            max(10px, env(safe-area-inset-left));
        }
        .chip {
          padding: 6px 11px 6px 9px;
          font-size: 12px;
        }
      }

      /* zoom controls */
      #zoom {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #zoom button {
        width: 40px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.95);
        color: var(--green);
        font:
          700 22px/1 Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(9, 64, 36, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        touch-action: manipulation;
      }
      #zoom button.rst {
        font-size: 15px;
      }
      #zoom button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      @media (hover: hover) {
        #zoom button:not(:disabled):hover {
          background: var(--green);
          color: #fff;
        }
      }
      #zoom button:focus-visible {
        outline: 2px solid var(--hi);
        outline-offset: 2px;
      }
      /* Office popups show the map without the home page's building selector. */
      .office-location-map #chips {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="chips" role="toolbar" aria-label="Choose a building"></div>
      <div id="mapwrap">
        <div id="legend" aria-hidden="true">
          <div>
            <h4>Buildings</h4>
            <span><b>BETA</b>Beta Building</span
            ><span><b>BH</b>Banzali Hall</span
            ><span><b>TH</b>Tanjangco Hall</span
            ><span><b>GH</b>Goseco Hall</span><span><b>PH</b>Puno Hall</span
            ><span><b>LH</b>Limlingan Hall</span
            ><span><b>NH</b>Narciso Hall</span>
            <h4>Parking</h4>
            <span><b>P1</b>Parking 1</span><span><b>P2</b>Parking 2</span>
          </div>
          <div>
            <h4>Room numbers</h4>
            <span><b>100</b>1st Floor</span><span><b>200</b>2nd Floor</span
            ><span><b>300</b>3rd Floor</span><span><b>400</b>4th Floor</span>
          </div>
        </div>
        <div id="hud" aria-live="polite">
          <div>
            <small>Route from main gate</small><strong id="status"></strong>
          </div>
          <button id="clr" type="button">Clear</button>
        </div>
        <div id="zoom" role="group" aria-label="Map zoom">
          <button type="button" id="zin" aria-label="Zoom in">+</button
          ><button type="button" id="zout" aria-label="Zoom out">&minus;</button
          ><button type="button" id="zrst" class="rst" aria-label="Reset zoom">
            &#8634;
          </button>
        </div>

          id="map"

    <script>

      var current = null;
      var officeMap = document.documentElement.classList.contains('office-location-map');
      var officeBuilding = null;
      function setOfficeBuilding(id) {
        if (!officeMap) return;
        officeBuilding = Object.prototype.hasOwnProperty.call(B, id) ? id : null;
        document.querySelectorAll('.bld').forEach(function (building) {
          var allowed = building.dataset.id === officeBuilding;
          building.style.pointerEvents = allowed ? '' : 'none';
          building.setAttribute('tabindex', allowed ? '0' : '-1');
          building.setAttribute('aria-disabled', allowed ? 'false' : 'true');
        });
        if (officeBuilding) go(officeBuilding);
        else clear(true);
      }
      if (officeMap) setOfficeBuilding(null);
      Object.keys(B).forEach(function (id) {
        var c = document.createElement("button");
        c.type = "button";
        c.className = "chip";
        c.id = "c-" + id;
        c.style.setProperty("--c", META[id][1]);
        c.innerHTML = "<i></i>" + B[id].name + " <b>" + META[id][0] + "</b>";
        c.addEventListener("click", function () {
          current === id ? clear() : go(id);
        });
        chips.appendChild(c);
      });
      function clear(keepView) {
        current = null;
        [path, casing, flow, dest].forEach(function (e) {
          e.classList.remove("go");
        });
        svg.classList.remove("active");
        document.querySelectorAll(".bld").forEach(function (e) {
          e.classList.remove("sel");
        });
        document.querySelectorAll(".chip").forEach(function (e) {
          e.classList.remove("on");
        });
        hud.classList.remove("on");
        if (!keepView && window.fitView) fitView(true);
      }
      function go(id) {
        if (!Object.prototype.hasOwnProperty.call(B, id) || (officeMap && id !== officeBuilding)) return;
        clear(true);
        current = id;
        void svg.getBoundingClientRect(); // restart animations
        var d = B[id].d;
        [path, casing, flow].forEach(function (e) {
          e.setAttribute("d", d);
        });
        var x, y;
        // destination = final point of the route (path is H/V segments)
        var len = path.getTotalLength(),
          pt = path.getPointAtLength(len);
        x = pt.x;
        y = pt.y;
        dest.setAttribute(
          "transform",
          "translate(" + x + " " + y + ") scale(0.8355)",
        );
        [path, casing, flow, dest].forEach(function (e) {
          e.classList.add("go");
        });
        svg.classList.add("active");
        document.getElementById("b-" + id).classList.add("sel");
        var _c = document.getElementById("c-" + id);
        _c.classList.add("on");
        if (_c.scrollIntoView)
          try {
            _c.scrollIntoView({
              block: "nearest",
              inline: "center",
              behavior: "smooth",

        statusEl.textContent = B[id].name;
        hud.classList.add("on");
        // Follow the drawing trail, then settle on the selected building.
        if (window.followRoute) followRoute(id);
      }
      document.getElementById("clr").addEventListener("click", function () {
        clear();
      });
      document.querySelectorAll(".bld").forEach(function (e) {
        e.addEventListener("click", function () {
          go(e.dataset.id);
        });
        e.addEventListener("keydown", function (ev) {

            ev.preventDefault();
            go(e.dataset.id);

      /* ===== viewport: fit / pan, and auto-focus on the route ===== */
      (function () {
        var MW = 1422,
          MH = 2304,
          MAXZ = 5,
          wrap = document.getElementById("mapwrap");
        var view = { z: 1, cx: MW / 2, cy: MH / 2 },
          raf = 0,
          moved = false,
          drag = null,
          pinch = null,
          ptrs = new Map(),
          lastTap = null,
          dtAt = 0,
          gz = null;
        var reduce =
          window.matchMedia &&
          matchMedia("(prefers-reduced-motion:reduce)").matches;
        function cz(z) {
          return Math.min(MAXZ, Math.max(1, z));
        }
        function box() {
          var r = svg.getBoundingClientRect();
          return { l: r.left, t: r.top, w: r.width || 1, h: r.height || 1 };
        }
        // visible map area at zoom z; always matches the frame's aspect ratio so nothing is letterboxed
        function dims(z) {
          var b = box(),
            A = b.w / b.h,
            M = MW / MH,
            w,
            h;
          if (A > M) {
            h = MH;
            w = h * A;
          } else {
            w = MW;
            h = w / A;
          }
          return { w: w / z, h: h / z };
        }
        function apply(v) {
          // Lazy/hidden frames can initialize before they have a usable size.
          // Keep the camera unchanged until layout supplies real dimensions.
          var bounds = svg.getBoundingClientRect();
          if (bounds.width <= 0 || bounds.height <= 0) return;
          var d = dims(v.z);
          v.cx =
            d.w >= MW
              ? MW / 2
              : Math.min(Math.max(v.cx, d.w / 2), MW - d.w / 2);
          v.cy =
            d.h >= MH
              ? MH / 2
              : Math.min(Math.max(v.cy, d.h / 2), MH - d.h / 2);
          svg.setAttribute(
            "viewBox",
            (v.cx - d.w / 2).toFixed(2) +
              " " +
              (v.cy - d.h / 2).toFixed(2) +
              " " +
              d.w.toFixed(2) +
              " " +
              d.h.toFixed(2),
          );
          // zoomed out: let the parent page scroll through the map (iframe); zoomed in: map takes the drag
          var zi = document.getElementById("zin"),
            zo = document.getElementById("zout"),
            zr = document.getElementById("zrst");
          if (zi) zi.disabled = v.z >= MAXZ - 0.01;
          if (zo) zo.disabled = v.z <= 1.01;
          if (zr) zr.disabled = v.z <= 1.01;
          var ta = v.z > 1.02 ? "none" : "pan-y";
          svg.style.touchAction = ta;
          wrap.style.touchAction = ta;
        }
        function setView(cx, cy, z, anim) {
          z = cz(z);
          cancelAnimationFrame(raf);
          if (!anim || reduce) {
            view = { z: z, cx: cx, cy: cy };
            apply(view);
            return;
          }
          var s = { z: view.z, cx: view.cx, cy: view.cy },
            t0 = performance.now(),
            D = 550;
          (function step(t) {
            var k = Math.min(1, (t - t0) / D),
              e = 1 - Math.pow(1 - k, 3);
            view = {
              z: Math.exp(Math.log(s.z) + (Math.log(z) - Math.log(s.z)) * e),
              cx: s.cx + (cx - s.cx) * e,
              cy: s.cy + (cy - s.cy) * e,
            };
            apply(view);
            if (k < 1) raf = requestAnimationFrame(step);
          })(t0);
        }
        function toMap(px, py) {
          var b = box(),
            d = dims(view.z);
          return [
            view.cx - d.w / 2 + ((px - b.l) / b.w) * d.w,
            view.cy - d.h / 2 + ((py - b.t) / b.h) * d.h,
          ];
        }
        function zoomAt(px, py, nz, anim) {
          nz = cz(nz);
          var m = toMap(px, py),
            b = box(),
            d = dims(nz),
            fx = (px - b.l) / b.w,
            fy = (py - b.t) / b.h;
          setView(m[0] - (fx - 0.5) * d.w, m[1] - (fy - 0.5) * d.h, nz, anim);
        }

        window.fitView = function (anim) {
          setView(MW / 2, MH / 2, 1, anim);
        };
        // Match the route's 400ms delay and 2800ms drawing duration.
        window.followRoute = function (id) {
          var building = document.getElementById("b-" + id);
          if (!building) return;
          var bounds = building.getBBox(), point = svg.createSVGPoint();
          point.x = bounds.x + bounds.width / 2;
          point.y = bounds.y + bounds.height / 2;
          // Buildings are inside a transformed SVG group; camera coordinates
          // belong to the root SVG, not to that group's local coordinate system.
          var world = document.getElementById("world").transform.baseVal.consolidate();
          if (world) point = point.matrixTransform(world.matrix);
          if (reduce) { setView(point.x, point.y, 2, false); return; }
          cancelAnimationFrame(raf);
          var length = path.getTotalLength(), start = path.getPointAtLength(0);
          var initial = { z: view.z, cx: view.cx, cy: view.cy };
          var started = performance.now(), delay = 400, duration = 2800;
          (function step(now) {
            var elapsed = Math.max(0, now - started), progress, target;
            if (elapsed < delay) {
              progress = 1 - Math.pow(1 - elapsed / delay, 3);
              view = {
                z: Math.exp(Math.log(initial.z) + (Math.log(2) - Math.log(initial.z)) * progress),
                cx: initial.cx + (start.x - initial.cx) * progress,
                cy: initial.cy + (start.y - initial.cy) * progress
              };
            } else {
              progress = Math.min(1, (elapsed - delay) / duration);
              progress = progress * progress * (3 - 2 * progress);
              target = path.getPointAtLength(length * progress);
              view = { z: 2, cx: target.x, cy: target.y };
            }
            apply(view);
            if (elapsed < delay + duration) raf = requestAnimationFrame(step);
            else setView(point.x, point.y, 2, true);
          })(started);
        };
        window.focusRoute = function (id) {
          try {
            var p = path.getBBox(),
              bl = document.getElementById("b-" + id).getBBox();
            var x0 = Math.min(p.x, bl.x, 920),
              y0 = Math.min(p.y, bl.y),
              x1 = Math.max(p.x + p.width, bl.x + bl.width, 1150),
              y1 = Math.max(p.y + p.height, bl.y + bl.height, 2095);
            var pad = 130;
            x0 -= pad;
            y0 -= pad;
            x1 += pad;
            y1 += pad;
            if (window.innerWidth <= 560) y1 += 120; // leave room for the status card on phones
            var d1 = dims(1);
            setView(
              (x0 + x1) / 2,
              (y0 + y1) / 2,
              Math.min(d1.w / (x1 - x0), d1.h / (y1 - y0)),
              true,
            );
          } catch (e) {}
        };

        // drag to pan
        function pts() {
          return Array.from(ptrs.values());
        }
        function resetGesture() {
          var captured = Array.from(ptrs.keys());
          ptrs.clear();
          drag = pinch = gz = lastTap = null;
          moved = false;
          svg.classList.remove("dragging");
          captured.forEach(function (id) {
            try { if (svg.hasPointerCapture(id)) svg.releasePointerCapture(id); } catch (_) {}
          });
        }
        svg.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          cancelAnimationFrame(raf); // user takes over from the route-follow camera
          ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
          // Keep taps targeted at the building. Capturing on the SVG here
          // retargets the eventual click to the map and bypasses its button.
          // A real drag below transfers capture to the SVG for panning.
          var captureTarget = e.target.closest('.bld') || svg;
          try { captureTarget.setPointerCapture(e.pointerId); } catch (_) {}
          if (ptrs.size === 1) {
            drag = {
              x: e.clientX,
              y: e.clientY,
              cx: view.cx,
              cy: view.cy,
              on: false,
            };
            moved = false;
          } else if (ptrs.size === 2) {
            var q = pts();
            pinch = {
              d: Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) || 1,
              z: view.z,
            };
            drag = null;
            moved = true;
            try {
              svg.setPointerCapture(e.pointerId);
            } catch (_) {}
          }
        });
        svg.addEventListener("pointermove", function (e) {
          if (!ptrs.has(e.pointerId)) return;
          ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
          if (ptrs.size === 2 && pinch) {
            var q = pts(),
              dd = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y) || 1;
            zoomAt(
              (q[0].x + q[1].x) / 2,
              (q[0].y + q[1].y) / 2,
              (pinch.z * dd) / pinch.d,
              false,
            );
            return;
          }
          if (ptrs.size > 1) return;
          if (drag) {
            var dx = e.clientX - drag.x,
              dy = e.clientY - drag.y;
            if (!drag.on && Math.hypot(dx, dy) > 6) {
              drag.on = true;
              moved = true;
              svg.classList.add("dragging");
              try {
                svg.setPointerCapture(e.pointerId);
              } catch (_) {}
            }
            if (drag.on) {
              var b2 = box(),
                d2 = dims(view.z);
              setView(
                drag.cx - (dx / b2.w) * d2.w,
                drag.cy - (dy / b2.h) * d2.h,
                view.z,
                false,
              );
            }
          }
        });
        function end(e) {
          if (!ptrs.has(e.pointerId)) return;
          var wasPinch = !!pinch;
          ptrs.delete(e.pointerId);
          pinch = null;
          // double-tap to zoom (touch). iOS never fires dblclick for touch, so do it here
          if (
            e.type === "pointerup" &&
            e.pointerType === "touch" &&
            ptrs.size === 0 &&
            !moved &&
            !wasPinch &&
            !(e.target.closest && e.target.closest(".bld"))
          ) {
            var now = performance.now();
            if (
              lastTap &&
              now - lastTap.t < 320 &&
              Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30
            ) {
              dtAt = now;
              lastTap = null;
              if (view.z >= MAXZ - 0.1) fitView(true);
              else zoomAt(e.clientX, e.clientY, view.z * 1.8, true);
            } else {
              lastTap = { t: now, x: e.clientX, y: e.clientY };
            }
          }
          if (ptrs.size === 0) {
            drag = null;
            svg.classList.remove("dragging");
          } else if (ptrs.size === 1) {
            var p = pts()[0];
            drag = { x: p.x, y: p.y, cx: view.cx, cy: view.cy, on: true };
          }
        }
        svg.addEventListener("pointerup", end);
        svg.addEventListener("pointercancel", end);
        svg.addEventListener("lostpointercapture", end);
        window.addEventListener("blur", resetGesture);
        document.addEventListener("visibilitychange", function () {
          resetGesture();
          if (!document.hidden) apply(view);
        });
        window.addEventListener("pageshow", function () {
          resetGesture();
          apply(view);
        });
        // Two-finger pinch must work even when fully zoomed out (touch-action is
        // pan-y there so one finger can still scroll the page). Without this the
        // browser grabs the gesture as a scroll, fires pointercancel and the pinch dies.
        svg.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1 && e.cancelable) e.preventDefault();
          },
          { passive: false },
        );
        // Safari (desktop trackpad pinch, and iOS page-zoom) uses gesture events.
        // When the pointer-based pinch is already running, leave it alone.
        svg.addEventListener("gesturestart", function (e) {
          e.preventDefault();
          gz = { z: view.z };
        });
        svg.addEventListener("gesturechange", function (e) {
          e.preventDefault();
          if (!gz || pinch) return;
          cancelAnimationFrame(raf);
          zoomAt(e.clientX, e.clientY, gz.z * e.scale, false);
        });
        svg.addEventListener("gestureend", function (e) {
          e.preventDefault();
          gz = null;
        });

        // a drag must not count as a tap on a building
        svg.addEventListener(
          "click",
          function (e) {
            if (moved) {
              e.stopPropagation();
              e.preventDefault();
              moved = false;
            }
          },
          true,
        );

        // zoom controls: buttons, mouse wheel (Ctrl/Cmd+wheel, or plain wheel once zoomed in), double-click
        function zoomCenter(f) {
          setView(view.cx, view.cy, view.z * f, true);
        }
        document.getElementById("zin").addEventListener("click", function () {
          zoomCenter(1.6);
        });
        document.getElementById("zout").addEventListener("click", function () {
          zoomCenter(1 / 1.6);
        });
        document.getElementById("zrst").addEventListener("click", function () {
          fitView(true);
        });
        svg.addEventListener(
          "wheel",
          function (e) {
            if (!(e.ctrlKey || e.metaKey) && view.z <= 1.02) return;
            e.preventDefault();
            cancelAnimationFrame(raf);
            var k = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
            zoomAt(
              e.clientX,
              e.clientY,
              view.z * Math.exp(-k * (e.ctrlKey ? 0.01 : 0.0015)),
              false,
            );
          },
          { passive: false },
        );
        svg.addEventListener("dblclick", function (e) {
          e.preventDefault();
          if (performance.now() - dtAt < 600) return; // already handled as a double-tap
          zoomAt(e.clientX, e.clientY, view.z * 1.8, true);
        });

        function resizeView() {
          resetGesture();
          apply(view);
        }
        apply(view);
        if (window.ResizeObserver) {
          var viewportObserver = new ResizeObserver(resizeView);
          viewportObserver.observe(wrap);
          viewportObserver.observe(svg);
        } else
          window.addEventListener("resize", resizeView);
      })();
    </script>
  </body>
</html>

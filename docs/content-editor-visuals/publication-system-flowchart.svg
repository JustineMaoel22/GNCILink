><rect x="205" y="162" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="210.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">START — publication requested</text><rect x="205" y="297" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="345.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Inspect page completeness</text><path d="M 350 427 L 495 475 L 350 523 L 205 475 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="480.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Content missing?</text><rect x="705" y="432" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="480.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Display completeness warning</text><path d="M 850 562 L 995 610 L 850 658 L 705 610 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="850" y="615.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Publish Anyway?</text><rect x="705" y="702" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="850" y="750.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">RETURN — continue editing</text><rect x="205" y="837" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="874.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Confirm publication and enter</text><text x="350" y="895.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">current Super Admin password</text><path d="M 350 967 L 495 1015 L 350 1063 L 205 1015 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1020.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Confirmation valid?</text><rect x="705" y="972" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="1009.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Show error or cancellation;</text><text x="850" y="1030.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">retry confirmation or return</text><rect x="205" y="1107" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1144.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Check permissions, request</text><text x="350" y="1165.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">validity, and content version</text><path d="M 350 1237 L 495 1285 L 350 1333 L 205 1285 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1290.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Checks pass?</text><rect x="705" y="1242" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="1279.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Report error; preserve work</text><text x="850" y="1300.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Reconcile newer page if stale</text><rect x="705" y="1377" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="850" y="1425.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">RETURN — needs correction</text><rect x="205" y="1512" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1560.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Execute next publication action</text><path d="M 350 1642 L 495 1690 L 350 1738 L 205 1690 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1695.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Action successful?</text><rect x="705" y="1647" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="1684.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Show failure; retain remaining work</text><text x="850" y="1705.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Check earlier committed actions</text><rect x="705" y="1782" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="850" y="1830.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">RETURN — incomplete publication</text><path d="M 350 1912 L 495 1960 L 350 2008 L 205 1960 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1965.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">More actions?</text><rect x="205" y="2052" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="2079.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Complete approval if applicable;</text><text x="350" y="2100.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">record publication and</text><text x="350" y="2121.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">clear completed checkpoint</text><rect x="205" y="2187" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="2224.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Release publication protection</text><text x="350" y="2245.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and refresh page</text><rect x="205" y="2322" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="2370.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">RETURN — publication completed</text></svg>
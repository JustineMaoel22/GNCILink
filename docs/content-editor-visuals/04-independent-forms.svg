x="7" fill="#f3f7f5"/><text x="350.0" y="1019.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 850 983 L 850 1090 L 495 1090" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="817.0" y="1023.5" width="66" height="24" rx="7" fill="#f3f7f5"/><text x="850.0" y="1040.5" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Submit</text><path d="M 350 1133 L 350 1197" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 1240 L 705 1240" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="1227.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="1244.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 1283 L 350 1347" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="1302.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="1319.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 350 1433 L 350 1497" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 350 1583 L 350 1647" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 1690 L 705 1690" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="1677.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="1694.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 1733 L 350 1797" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="1752.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="1769.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><rect x="205" y="162" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="210.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Open existing embedded form</text><rect x="205" y="307" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="344.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Enter changes; submit existing</text><text x="350" y="365.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">create / edit / delete action</text><rect x="205" y="452" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="489.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Validate session, role, CSRF,</text><text x="350" y="510.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">ownership, and action</text><path d="M 350 597 L 495 645 L 350 693 L 205 645 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="650.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Super Admin?</text><rect x="705" y="602" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="639.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Run applicable confirmation</text><text x="850" y="660.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and conflict protection</text><rect x="705" y="747" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="850" y="784.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Execute original handler</text><text x="850" y="805.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Return result and audit</text><rect x="205" y="747" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="350" y="784.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Stage proposal fields</text><text x="350" y="805.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and validated uploads privately</text><path d="M 350 892 L 495 940 L 350 988 L 205 940 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="945.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Draft intent?</text><rect x="705" y="897" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="850" y="934.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Keep proposal Draft</text><text x="850" y="955.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Author revises and submits</text><rect x="205" y="1047" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="350" y="1084.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Pending proposal</text><text x="350" y="1105.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Super Admin reviews</text><path d="M 350 1192 L 495 1240 L 350 1288 L 205 1240 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1245.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Approve?</text><rect x="705" y="1197" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="1234.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Record reason / feedback</text><text x="850" y="1255.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Return to author for revision</text><rect x="205" y="1347" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1374.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Confirm; mark Processing</text><text x="350" y="1395.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">One-use reviewer session</text><text x="350" y="1416.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">replays allowlisted handler</text><rect x="205" y="1497" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1524.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Original handler revalidates</text><text x="350" y="1545.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">permissions, CSRF, uploads,</text><text x="350" y="1566.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">inputs, and conflicts</text><path d="M 350 1642 L 495 1690 L 350 1738 L 205 1690 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1695.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Confirmed success?</text><rect x="705" y="1647" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="1674.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Failure / uncertain / processing</text><text x="850" y="1695.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Inspect actual content</text><text x="850" y="1716.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">No automatic retry</text><rect x="205" y="1797" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="1845.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Record Approved and audit</text></svg>
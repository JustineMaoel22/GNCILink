<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2210" viewBox="0 0 1100 2210" role="img" aria-labelledby="title desc">
<title id="title">03 / Publish and approval</title><desc id="desc">Only Super Admin publishes directly. Content Editors submit proposals.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#577469"/></marker></defs>
<rect width="1100" height="2210" rx="20" fill="#f3f7f5"/>
<rect width="1100" height="130" rx="20" fill="#174e3b"/>
<text x="42" y="56" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">03 / Publish and approval</text>
<text x="42" y="95" fill="#d4e7dd" font-family="Segoe UI,Arial,sans-serif" font-size="17">Only Super Admin publishes directly. Content Editors submit proposals.</text><path d="M 350 248 L 350 307" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 350 L 705 350" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="337.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="354.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 393 L 350 587" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="477.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="494.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 850 393 L 850 447" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 850 533 L 850 587" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 850 673 L 850 732" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 850 818 L 850 882" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 850 968 L 850 1027" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="833.0" y="984.5" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="850.0" y="1001.5" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 705 925 L 640 925 L 640 630 L 495 630" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="651.5" y="912.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="672.5" y="929.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 350 673 L 350 732" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 350 818 L 350 882" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="837.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="854.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 205 775 L 95 775 L 95 1210 L 205 1210" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="133.0" y="762.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="150.0" y="779.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 968 L 350 1027" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="293.0" y="984.5" width="114" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="1001.5" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Keep editing</text><path d="M 495 925 L 565 925 L 565 1210 L 495 1210" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="465.0" y="912.0" width="130" height="24" rx="7" fill="#f3f7f5"/><text x="530.0" y="929.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Publish anyway</text><path d="M 350 1253 L 350 1317" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 1360 L 705 1360" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="1347.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="1364.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 1403 L 350 1467" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="1422.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="1439.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 350 1553 L 350 1617" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 350 1703 L 350 1767" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 1810 L 705 1810" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="1797.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="1814.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 1853 L 350 1917" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="1872.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="1889.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 350 2003 L 350 2067" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="205" y="162" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="210.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Choose Publish / Submit</text><path d="M 350 302 L 495 350 L 350 398 L 205 350 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="355.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Super Admin?</text><rect x="705" y="307" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="344.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Content Editor:</text><text x="850" y="365.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">confirm Submit for approval</text><rect x="705" y="447" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="850" y="484.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Save private checkpoint</text><text x="850" y="505.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Checks from diagram 02 apply</text><rect x="705" y="587" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="850" y="624.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Validate saved revision;</text><text x="850" y="645.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">create pending snapshot</text><rect x="705" y="732" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="769.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Super Admin reviews</text><text x="850" y="790.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">proposed text and media</text><path d="M 850 877 L 995 925 L 850 973 L 705 925 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="850" y="930.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Approve?</text><rect x="705" y="1027" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="1054.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Reject / request revision</text><text x="850" y="1075.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Record feedback; author</text><text x="850" y="1096.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">revises and resubmits</text><rect x="205" y="587" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="635.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Inspect content completeness</text><path d="M 350 727 L 495 775 L 350 823 L 205 775 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="780.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Missing content?</text><path d="M 350 877 L 495 925 L 350 973 L 205 925 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="919.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Keep Editing or</text><text x="350" y="940.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Publish Anyway?</text><rect x="205" y="1027" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="1064.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Keep editing</text><text x="350" y="1085.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">No publication begins</text><rect x="205" y="1167" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1204.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Confirm publication; provide</text><text x="350" y="1225.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">current Super Admin password</text><path d="M 350 1312 L 495 1360 L 350 1408 L 205 1360 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1365.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Confirmation valid?</text><rect x="705" y="1317" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="1354.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Retry under rate limits</text><text x="850" y="1375.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">or cancel and keep editing</text><rect x="205" y="1467" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1504.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Run existing page save requests</text><text x="350" y="1525.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">with confirmation token</text><rect x="205" y="1617" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1654.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Server checks access, CSRF,</text><text x="350" y="1675.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">input, versions, lock, and lease</text><path d="M 350 1762 L 495 1810 L 350 1858 L 205 1810 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1815.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">All writes succeed?</text><rect x="705" y="1767" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="1794.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Report error; keep remaining work</text><text x="850" y="1815.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Earlier writes may be committed</text><text x="850" y="1836.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Release lease / confirmation</text><rect x="205" y="1917" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="350" y="1944.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Complete review if applicable;</text><text x="350" y="1965.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">record publication summary;</text><text x="350" y="1986.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">clear completed checkpoint</text><rect x="205" y="2067" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="2104.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Release operation protection</text><text x="350" y="2125.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Published changes are public</text></svg>
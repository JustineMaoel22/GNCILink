<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1880" viewBox="0 0 1100 1880" role="img" aria-labelledby="title desc">
<title id="title">01 / Access and editing</title><desc id="desc">Who can enter, how content loads, and what stays in the working preview.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#577469"/></marker></defs>
<rect width="1100" height="1880" rx="20" fill="#f3f7f5"/>
<rect width="1100" height="130" rx="20" fill="#174e3b"/>
<text x="42" y="56" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">01 / Access and editing</text>
<text x="42" y="95" fill="#d4e7dd" font-family="Segoe UI,Arial,sans-serif" font-size="17">Who can enter, how content loads, and what stays in the working preview.</text><path d="M 360 248 L 360 297" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 360 383 L 360 442" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 505 485 L 705 485" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="588.0" y="472.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="605.0" y="489.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 360 528 L 360 587" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="339.0" y="544.5" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="360.0" y="561.5" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 360 673 L 360 732" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 505 775 L 705 775" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="588.0" y="762.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="605.0" y="779.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 360 818 L 360 877" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="339.0" y="834.5" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="360.0" y="851.5" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 360 963 L 360 1017" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 360 1103 L 360 1162" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 505 1205 L 705 1205" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="584.0" y="1192.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="605.0" y="1209.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 360 1248 L 360 1307" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="343.0" y="1264.5" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="360.0" y="1281.5" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 850 1248 L 850 1350 L 505 1350" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 360 1393 L 360 1447" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 360 1533 L 360 1587" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 505 1630 L 650 1630 L 650 1530 L 705 1530" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="548.5" y="1617.0" width="58" height="24" rx="7" fill="#f3f7f5"/><text x="577.5" y="1634.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Draft</text><path d="M 505 1630 L 650 1630 L 650 1670 L 705 1670" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="540.5" y="1617.0" width="74" height="24" rx="7" fill="#f3f7f5"/><text x="577.5" y="1634.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Publish</text><path d="M 360 1673 L 360 1747" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="215" y="162" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="360" y="210.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Open Content Editor</text><rect x="215" y="297" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="360" y="334.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Refresh account identity</text><text x="360" y="355.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and initialize session</text><path d="M 360 437 L 505 485 L 360 533 L 215 485 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="360" y="490.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Account allowed?</text><rect x="705" y="442" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="479.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Sign in, change password,</text><text x="850" y="500.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">or reject protected route</text><rect x="215" y="587" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="360" y="624.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Load permitted pages</text><text x="360" y="645.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and select content</text><path d="M 360 727 L 505 775 L 360 823 L 215 775 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="360" y="780.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Valid page / route?</text><rect x="705" y="732" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="769.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Return to content hub</text><text x="850" y="790.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">or reject request</text><rect x="215" y="877" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="360" y="914.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Capture live-content baseline</text><text x="360" y="935.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">before loading preview</text><rect x="215" y="1017" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="360" y="1054.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Load real website page</text><text x="360" y="1075.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and page-specific adapter</text><path d="M 360 1157 L 505 1205 L 360 1253 L 215 1205 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="360" y="1210.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Saved state exists?</text><rect x="705" y="1162" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="850" y="1189.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Restore own draft or</text><text x="850" y="1210.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">authorized review snapshot</text><text x="850" y="1231.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">with its original baseline</text><rect x="215" y="1307" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="360" y="1344.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Edit text, media, PDFs,</text><text x="360" y="1365.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">ordering, and layout</text><rect x="215" y="1447" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="360" y="1484.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Preview desktop / tablet / mobile</text><text x="360" y="1505.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Undo or redo local changes</text><path d="M 360 1582 L 505 1630 L 360 1678 L 215 1630 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="360" y="1635.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Choose next action</text><rect x="705" y="1487" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="850" y="1524.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Save draft</text><text x="850" y="1545.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Go to diagram 02</text><rect x="705" y="1627" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="850" y="1664.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Publish or submit</text><text x="850" y="1685.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Go to diagram 03</text><rect x="705" y="877" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="904.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Presence every 5 seconds</text><text x="850" y="925.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">shows viewers / editors</text><text x="850" y="946.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Other-editor warning is advisory</text><rect x="215" y="1747" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="360" y="1784.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Local edits are not public</text><text x="360" y="1805.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Undo cannot reverse server saves</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1640" viewBox="0 0 1100 1640" role="img" aria-labelledby="title desc">
<title id="title">02 / Private drafts and conflicts</title><desc id="desc">Checkpoints belong to one account and route. There is no automatic save.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#577469"/></marker></defs>
<rect width="1100" height="1640" rx="20" fill="#f3f7f5"/>
<rect width="1100" height="130" rx="20" fill="#174e3b"/>
<text x="42" y="56" fill="white" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">02 / Private drafts and conflicts</text>
<text x="42" y="95" fill="#d4e7dd" font-family="Segoe UI,Arial,sans-serif" font-size="17">Checkpoints belong to one account and route. There is no automatic save.</text><path d="M 350 248 L 350 302" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 350 388 L 350 442" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 350 528 L 350 587" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 630 L 705 630" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="617.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="634.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 673 L 350 742" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="694.5" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="711.5" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 350 828 L 350 892" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 935 L 705 935" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="922.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="939.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 978 L 350 1042" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="997.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="1014.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 350 1128 L 350 1192" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 495 1235 L 705 1235" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="583.0" y="1222.0" width="34" height="24" rx="7" fill="#f3f7f5"/><text x="600.0" y="1239.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">No</text><path d="M 350 1278 L 350 1342" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="329.0" y="1297.0" width="42" height="24" rx="7" fill="#f3f7f5"/><text x="350.0" y="1314.0" text-anchor="middle" fill="#385c4d" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Yes</text><path d="M 350 1428 L 350 1492" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 850 978 L 850 1042" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 995 1085 L 1030 1085 L 1030 1385 L 995 1385" fill="none" stroke="#577469" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="205" y="162" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="210.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Save draft / Ctrl or Cmd + S</text><rect x="205" y="302" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="339.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Serialize preview, pending state,</text><text x="350" y="360.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">selected media, and baseline</text><rect x="205" y="442" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="479.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Send authenticated POST</text><text x="350" y="500.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">CSRF + route + draft revision</text><path d="M 350 582 L 495 630 L 350 678 L 205 630 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="635.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Authorized and valid?</text><rect x="705" y="587" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="624.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Reject request</text><text x="850" y="645.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Keep pending browser work</text><rect x="205" y="742" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="779.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Acquire lock; check live</text><text x="350" y="800.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">version and publishing lease</text><path d="M 350 887 L 495 935 L 350 983 L 205 935 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="940.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Current and unlocked?</text><rect x="705" y="892" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="929.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">HTTP 409 conflict</text><text x="850" y="950.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Keep local changes</text><rect x="205" y="1042" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="350" y="1079.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Validate snapshot size, shape,</text><text x="350" y="1100.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and own checkpoint revision</text><path d="M 350 1187 L 495 1235 L 350 1283 L 205 1235 Z" fill="#fff4d8" stroke="#d6a344" stroke-width="1.5"/><text x="350" y="1240.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Draft revision current?</text><rect x="705" y="1192" width="290" height="86" rx="12" fill="#ffebe7" stroke="#ce7566" stroke-width="1.5"/><text x="850" y="1229.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Reject stale checkpoint</text><text x="850" y="1250.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Do not overwrite another tab</text><rect x="205" y="1342" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="350" y="1379.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Save chunked private snapshot</text><text x="350" y="1400.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">and return next revision</text><rect x="205" y="1492" width="290" height="86" rx="35" fill="#dff3e8" stroke="#398763" stroke-width="1.5"/><text x="350" y="1529.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Draft saved</text><text x="350" y="1550.5" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Public website stays unchanged</text><rect x="705" y="1042" width="290" height="86" rx="12" fill="#e8f0fc" stroke="#789bd0" stroke-width="1.5"/><text x="850" y="1069.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">For newer live content:</text><text x="850" y="1090.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">explicit Save recovery draft</text><text x="850" y="1111.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">retains the old baseline</text><rect x="705" y="1342" width="290" height="86" rx="12" fill="#ffffff" stroke="#b6ccc3" stroke-width="1.5"/><text x="850" y="1369.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Reopen current page and</text><text x="850" y="1390.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">reconcile before publishing</text><text x="850" y="1411.0" text-anchor="middle" fill="#173c2e" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">No merge or overwrite bypass</text></svg>